[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "berlinduck"
version = "0.1.0"
description = "Semantic search and RAG over hotel reviews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "datasets>=2.19,<4",
    "sentence-transformers>=2.7,<4",
    "qdrant-client>=1.12,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
]

[project.scripts]
berlinduck-demo = "berlinduck.demo:main"
berlinduck-ingest = "berlinduck.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/berlinduck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
